# 10 站并发注册
scenarioName: "10站并发注册+心跳"
stationCount: 10
sasocHost: "192.168.1.1"
sasocPort: 4567
registration:
  concurrency: 10
  snPrefix: "MS2026"
  model: "WNT-MS-2000"
  version: "V2.0.1"
  ipRange: "192.168.2.{index}"
heartbeat:
  enabled: true
  intervalSeconds: 30
  durationSeconds: 1800
metrics:
  collectIntervalSeconds: 5
  reportFormat: "html"
