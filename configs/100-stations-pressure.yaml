# 100 站压测场景
scenarioName: "100台安检站并发注册+持续心跳"
stationCount: 100
sasocHost: "192.168.1.1"
sasocPort: 4567
registration:
  concurrency: 100
  snPrefix: "MS2026"
  model: "WNT-MS-2000"
  version: "V2.0.1"
  ipRange: "192.168.2.{index}"
heartbeat:
  enabled: true
  intervalSeconds: 30
  durationSeconds: 3600
metrics:
  collectIntervalSeconds: 5
  reportFormat: "html"
